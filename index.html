<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>请求韧性观察台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">Fetch · AbortController · IndexedDB · Worker · Canvas</p>
      <h1>请求韧性观察台</h1>
      <p class="subtitle">观察重试、退避抖动、超时、缓存降级、并发隔离与卸载取消。</p>
    </div>
    <div class="header-actions">
      <button id="clearHistory" class="secondary" type="button">清空历史</button>
      <button id="clearCache" class="secondary" type="button">清空缓存</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel request-panel" aria-labelledby="requestTitle">
      <h2 id="requestTitle">发起请求</h2>
      <form id="requestForm">
        <label class="field span-2">
          <span>URL 或场景</span>
          <select id="preset">
            <option value="success">成功场景（httpbingo /get）</option>
            <option value="http503">HTTP 错误（/status/503，可重试）</option>
            <option value="http404">HTTP 错误（/status/404，不重试）</option>
            <option value="timeout">超时场景（/delay/8，1.6 秒超时）</option>
            <option value="offline">网络中断（不可连接地址）</option>
            <option value="custom">自定义 URL</option>
          </select>
        </label>

        <label class="field span-2">
          <span>自定义 URL</span>
          <input id="url" name="url" type="url" placeholder="https://example.com/api" autocomplete="off">
        </label>

        <label class="field">
          <span>方法</span>
          <select id="method">
            <option>GET</option>
            <option>POST</option>
            <option>PUT</option>
            <option>DELETE</option>
          </select>
        </label>

        <label class="field">
          <span>超时（毫秒）</span>
          <input id="timeoutMs" type="number" min="100" max="30000" step="100" value="6000">
        </label>

        <label class="field">
          <span>重试次数</span>
          <input id="retries" type="number" min="0" max="8" step="1" value="3">
        </label>

        <label class="field">
          <span>基础退避（毫秒）</span>
          <input id="baseDelayMs" type="number" min="0" max="10000" step="50" value="400">
        </label>

        <label class="field">
          <span>退避上限（毫秒）</span>
          <input id="maxDelayMs" type="number" min="0" max="30000" step="100" value="4000">
        </label>

        <label class="field">
          <span>抖动（0–100%）</span>
          <input id="jitter" type="number" min="0" max="1" step="0.05" value="0.25">
        </label>

        <label class="field">
          <span>缓存 TTL（毫秒，仅 GET）</span>
          <input id="cacheTtlMs" type="number" min="0" max="600000" step="1000" value="30000">
        </label>

        <label class="checkbox span-2">
          <input id="useCache" type="checkbox" checked>
          <span>失败时允许使用过期缓存；无缓存时返回占位数据</span>
        </label>

        <button class="primary span-2" type="submit">发起请求</button>
      </form>
    </section>

    <section class="panel timeline-panel" aria-labelledby="timelineTitle">
      <div class="section-heading">
        <div>
          <h2 id="timelineTitle">请求时序</h2>
          <p id="timelineSummary">暂无请求</p>
        </div>
        <button id="cancelAll" class="danger" type="button">取消全部</button>
      </div>
      <canvas id="timelineCanvas" height="360" aria-label="请求时序 Canvas 图表"></canvas>
      <div id="tooltip" class="tooltip" role="status" aria-live="polite"></div>
      <div class="legend">
        <span><i class="legend-dot running"></i>进行中</span>
        <span><i class="legend-dot success"></i>成功</span>
        <span><i class="legend-dot retry"></i>等待退避</span>
        <span><i class="legend-dot error"></i>失败</span>
        <span><i class="legend-dot cache"></i>缓存降级</span>
        <span><i class="legend-dot cancelled"></i>取消</span>
      </div>
    </section>

    <section class="panel history-panel" aria-labelledby="historyTitle">
      <div class="section-heading">
        <div>
          <h2 id="historyTitle">历史与详情</h2>
          <p>每次尝试独立计时，多个请求并发互不影响。</p>
        </div>
      </div>
      <div id="historyList" class="history-list empty">暂无请求历史</div>
    </section>
  </main>

  <template id="historyItemTemplate">
    <article class="history-item">
      <div class="history-main">
        <div class="history-row">
          <span class="method-badge"></span>
          <span class="history-url"></span>
          <span class="status-badge"></span>
        </div>
        <div class="history-meta">
          <span class="attempt-count"></span>
          <span class="elapsed"></span>
          <span class="created-at"></span>
        </div>
      </div>
      <button class="text-button cancel-button" type="button">取消</button>
      <pre class="details" hidden></pre>
    </article>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
